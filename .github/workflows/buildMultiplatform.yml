name: Build Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-android:
    strategy:
      matrix:
        java_version:
          - 21
    runs-on: ubuntu-latest
    name: Build Android (Java ${{ matrix.java_version }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build On-Device Native LLM Engine (libunciv_llama.so for arm64-v8a)
        run: |
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_LATEST_HOME"
          elif [ -n "$ANDROID_NDK_HOME" ]; then
            NDK_DIR="$ANDROID_NDK_HOME"
          else
            NDK_DIR=$(ls -d $ANDROID_HOME/ndk/* | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_DIR"
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S core/native -B /tmp/build-android-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLAMA_CPP_DIR=/tmp/llama.cpp \
            -DGGML_CPU_ARM_ARCH=armv8.2-a+dotprod+fp16+i8mm \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DGGML_OPENMP=OFF
          cmake --build /tmp/build-android-arm64 --target unciv_llama -j 4
          mkdir -p android/libs/arm64-v8a
          cp /tmp/build-android-arm64/libunciv_llama.so android/libs/arm64-v8a/libunciv_llama.so
          ls -lh android/libs/arm64-v8a/libunciv_llama.so

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android debug and release APK / AAB
        run: |
          chmod +x gradlew
          mkdir -p whatsNewDirectory
          echo "Unciv-LLM Local Diplomatic Negotiation Build" > whatsNewDirectory/whatsnew-en-US
          set -x
          ./gradlew :android:assembleDebug
          ./gradlew :android:assembleRelease
          ./gradlew :android:bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-LLM-Android-APK
          path: |
            android/build/outputs/apk/*/*.apk
            android/build/outputs/bundle/*/*.aab
          retention-days: 30
        continue-on-error: true

      - name: Attach Android APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk
        continue-on-error: true

  build-desktop:
    defaults:
      run:
        shell: sh
    name: Build Desktop for ${{ matrix.os }} (Java ${{ matrix.java_version }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        java_version:
          - 21

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Desktop app
        run: |
          chmod +x gradlew
          ./gradlew desktop:dist

      - name: Build the Java server
        run: ./gradlew server:dist

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-LLM-Desktop-JAR
          path: desktop/build/libs/*.jar
          retention-days: 30
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true

      - name: Upload Java server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Unciv-LLM-Server-JAR
          path: server/build/libs/*.jar
          retention-days: 30
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true

      - name: Attach Desktop JAR to GitHub Release (on tag push)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/libs/*.jar
        continue-on-error: true
