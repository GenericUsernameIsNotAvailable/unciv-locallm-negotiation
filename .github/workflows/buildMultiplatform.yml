# Jobs to test the code base and build the Android APK, Desktop JAR, and Server JAR
name: Build Multiplatform

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-android:
    strategy:
      matrix:
        java_version:
          - 21
    runs-on: ubuntu-latest
    name: Build Android (Java ${{ matrix.java_version }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android debug and release APK / AAB
        run: |
          chmod +x gradlew
          mkdir -p whatsNewDirectory
          echo "Unciv Local-LLM Diplomatic Negotiation Build" > whatsNewDirectory/whatsnew-en-US
          set -x
          ./gradlew :android:assembleDebug
          ./gradlew :android:assembleRelease
          ./gradlew :android:bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-and-AAB
          path: |
            android/build/outputs/apk/*/*.apk
            android/build/outputs/bundle/*/*.aab
          retention-days: 30
        continue-on-error: true

      - name: Attach Android APK to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/build/outputs/apk/debug/*.apk
            android/build/outputs/apk/release/*.apk
        continue-on-error: true

  build-desktop:
    defaults:
      run:
        shell: sh
    name: Build Desktop for ${{ matrix.os }} (Java ${{ matrix.java_version }})
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        java_version:
          - 21

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the Desktop app
        run: |
          chmod +x gradlew
          ./gradlew desktop:dist

      - name: Build the Java server
        run: ./gradlew server:dist

      - name: Upload Desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop-JAR
          path: desktop/build/libs/*.jar
          retention-days: 30
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true

      - name: Upload Java server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Server-JAR
          path: server/build/libs/*.jar
          retention-days: 30
        if: ${{ matrix.os == 'ubuntu-latest' }}
        continue-on-error: true

      - name: Attach Desktop JAR to GitHub Release (on tag push)
        if: matrix.os == 'ubuntu-latest' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/libs/*.jar
        continue-on-error: true
