name: Build iOS IPA (Cloud Mac)

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-ios-ipa:
    runs-on: macos-latest
    name: Build Unsigned iOS IPA for Sideloadly / AltStore
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run RoboVM API Compatibility Check & Archive App
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache :ios:verifyRoboVmApiCompatibility
          ./gradlew --no-configuration-cache :ios:robovmArchive -PiosSkipSigning=true -Probovm.arch=arm64 -Probovm.archs=arm64

      - name: Package .app into Unsigned .ipa for Sideloadly / AltStore
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find compiled .app bundle under ios/build"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qry Unciv4iOS-unsigned.ipa Payload

      - name: Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unciv4iOS-unsigned-ipa
          path: Unciv4iOS-unsigned.ipa
          retention-days: 30

      - name: Attach Unsigned iOS IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Unciv4iOS-unsigned.ipa
        continue-on-error: true
